<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>PrepApp</title>
  <meta name="description" content="PrepApp — crea y organiza tus rutinas de entrenamiento." />

  <!-- Tema / navegador -->
  <meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#0b0e14" />
  <meta name="color-scheme" content="dark" />

  <!-- iOS: modo standalone al añadir a pantalla de inicio -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PrepApp" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app" role="main"></div>

  <!-- Aviso a pantalla completa cuando el móvil está en horizontal: la
       app de debajo se queda congelada tal cual, sin reaccionar. -->
  <div id="rotate-lock" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="2" width="10" height="16" rx="2" />
      <path d="M12 20a7 7 0 0 0 7-7" />
      <path d="M21.5 14.5 19 12l-2 2.5" />
    </svg>
    <p>Gira el teléfono a vertical para usar PrepApp</p>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
